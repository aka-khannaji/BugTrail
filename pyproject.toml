[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "getbugtrail"
version = "0.1.0"
description = "Find the likely root cause of bugs by connecting runtime errors with code, Git history, dependencies, and database evidence."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["debugging", "stack-trace", "git-blame", "root-cause-analysis", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Debuggers",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/aka-khannaji/BugTrail"
Source = "https://github.com/aka-khannaji/BugTrail"
Issues = "https://github.com/aka-khannaji/BugTrail/issues"

[project.scripts]
bugtrail = "bugtrail.cli:app"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bugtrail"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]